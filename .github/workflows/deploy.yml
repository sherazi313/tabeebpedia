name: 🚀 Deploy Tabeeb Pedia to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧹 Clean Data & Verify Zero Errors
        run: node scripts/clean-all-data.js

      - name: ⚡ Build Production Bundle
        run: npm run build

      - name: 🧹 Post-Build Data Verification
        run: node scripts/clean-all-data.js

      - name: 🚀 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          server-dir: ./
          local-dir: ./dist/
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            old-wp-backup/**
            wp-content/**
            uploads/**
            ditp/**
            himalayan/**
            jamiatatibba/**
            .private/**
            public_html/**
            data/analytics.json
            **/data/analytics.json
            data/admin_2fa_tokens.json
            **/data/admin_2fa_tokens.json
            data/admin_trusted_devices.json
            **/data/admin_trusted_devices.json
            data/password_resets.json
            **/data/password_resets.json
            data/**
            **/data/**
            data/*
            **/data/*
            data/doctors.json
            **/data/doctors.json
            data/articles.json
            **/data/articles.json
            data/settings.json
            **/data/settings.json
            data/pdf-books.json
            **/data/pdf-books.json
            data/pages.json
            **/data/pages.json
            data/glossary.json
            **/data/glossary.json
            data/categories.json
            **/data/categories.json
            data/media.json
            **/data/media.json
