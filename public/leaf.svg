<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Emerald to Deep Navy -->
    <linearGradient id="tabeebBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Leaf Main Body Gradient -->
    <linearGradient id="leafGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Leaf Vein & Highlight Gradient -->
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.35" />
    </filter>

    <!-- Inner Shadow / Depth -->
    <filter id="depth">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#tabeebBg)" />
  <rect x="16" y="16" width="480" height="480" rx="128" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Botanical Emblem Group -->
  <g filter="url(#softGlow)">
    <!-- Primary Healing Leaf -->
    <path d="M 370 120 C 370 120 220 125 155 210 C 95 288 125 385 215 390 C 310 395 385 295 385 190 C 385 155 378 132 370 120 Z" 
          fill="url(#leafGrad)" 
          filter="url(#depth)" />

    <!-- Leaf Central Stem & Primary Vein -->
    <path d="M 175 355 C 210 320 265 240 370 120" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- Lateral Veins -->
    <!-- Right Upper -->
    <path d="M 290 205 C 325 195 350 200 365 215" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />
    
    <!-- Right Middle -->
    <path d="M 252 250 C 290 252 325 270 338 295" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Left Upper -->
    <path d="M 270 230 C 235 220 200 235 180 255" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Left Lower -->
    <path d="M 225 290 C 190 295 168 320 155 345" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Sprout / Second Smaller Leaf (Renewal & Life) -->
    <path d="M 180 350 C 130 330 115 275 145 235 C 162 212 195 230 202 265 C 208 298 198 335 180 350 Z" 
          fill="#6ee7b7" 
          opacity="0.85" />
    
    <!-- Medicine Cross / Golden Sparkle Accent -->
    <circle cx="380" cy="115" r="14" fill="#fbbf24" />
    <path d="M 380 95 L 380 135 M 360 115 L 400 115" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
